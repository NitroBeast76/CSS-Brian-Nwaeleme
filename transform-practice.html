<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transform Practice</title>
    <link rel="stylesheet" href="CSS/styles.css">
    <style>
        * {
            margin: 20px;
            padding: 10px;
            box-sizing: border-box;
            
        }

        body {
            background-image: url('Imagesss/mountain.jpg');
            background-repeat: no-repeat;
            background-size: cover;
        }

        .nav-transition {
            background-color: burlywood;
            padding: 5px;
            margin: 4px;
            border: 2px solid black;
            transition: width 4s, height 4s, background-color 4s, transform 4s, border 4s;
        }

        .nav-transition:hover{
            background-color: gold;
            width: 150px;
            height: 100px;
            transform: rotate(15deg) skew(10deg, 10deg);
            border: 5px solid white;
            
        }

        nav a{
            text-decoration: none;
            color: black;
        }
        nav a:hover{
            color: royalblue;
            width: 100px;
            height: 50px;
            transform: rotate(5deg);
        }

        .test{
            height: 150px;
            width: 150px;
            border-radius: 10%;
            background-color: goldenrod;
            transition: transform 15s ease-in-out, background-color 15s ease-in-out, width 15s ease-in-out, height 15s ease-in-out;
        }

        .test:hover{
            transform: rotate(360000000deg);
            background: linear-gradient(to bottom right, #ff6a00, #ee0979);
            width: 600px;
            height: 600px;
        }

        .test-2{
            height: 150px;
            width: 150px;
            border-radius: 50%;
            background-color: goldenrod;
            animation: test-2 5s  infinite alternate;
        }
        
        @keyframes test-2{
            0% {
                background-color: green; ;
                transform: translate(0px, 0px);
                box-shadow: 0px 0px 60px green;
            }

            25% {
                background-color: blue; 
                transform: translate(1000px) ;
                box-shadow: 0px 0px 60px blue;
            }

            50% {
                background-color: red; 
                transform: translate(1000px)  skew(180deg);
                box-shadow: 0px 0px 60px red;
            }
            75% {
                background-color: yellow; 
                transform: translate(1000px) ;
                box-shadow: 0px 0px 60px yellow;
            }
            100% {
                background-color: blue; 
                transform: translate(0px) ;
                box-shadow: 0px 0px 60px blue;
            }


        }

    </style>
</head>
<body>
